services:
  # --- Backend: FastAPI ---
  - type: web
    name: saarthii-api
    rootDir: backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

  # --- Frontend: Vite ---
  - type: web
    name: saarthiicare-frontend
    rootDir: frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html