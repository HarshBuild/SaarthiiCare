services:
  # --- Backend: FastAPI ---
  - type: web
    name: saarthii-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDirectory: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*" # Update this to your frontend URL after first deploy
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard
      - key: SECRET_KEY
        generateValue: true

  # --- Frontend: Vite ---
  - type: web
    name: saarthii-web
    runtime: static
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDirectory: frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: saarthii-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
